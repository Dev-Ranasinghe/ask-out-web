<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="duckGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="70%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#F7B228"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF85A1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF85A1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7A223B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Shadow -->
    <ellipse cx="100" cy="175" rx="55" ry="12" fill="#E8B4B8" opacity="0.4"/>
    
    <!-- Body -->
    <path d="M 60 130 C 50 150 70 170 100 170 C 130 170 150 150 140 130 C 145 110 135 90 125 85 C 120 70 80 70 75 85 C 65 90 55 110 60 130 Z" fill="url(#duckGrad)"/>
    
    <!-- Wings -->
    <path d="M 55 125 C 40 120 45 145 65 140 C 60 135 58 130 55 125 Z" fill="#F7B228"/>
    <path d="M 145 125 C 160 120 155 145 135 140 C 140 135 142 130 145 125 Z" fill="#F7B228"/>

    <!-- Head -->
    <circle cx="100" cy="80" r="42" fill="url(#duckGrad)"/>

    <!-- Cheeks -->
    <circle cx="72" cy="90" r="10" fill="url(#cheekGrad)"/>
    <circle cx="128" cy="90" r="10" fill="url(#cheekGrad)"/>

    <!-- Eyes -->
    <ellipse cx="80" cy="76" rx="5" ry="7" fill="#2B1E1A"/>
    <circle cx="78" cy="74" r="2.5" fill="#FFFFFF"/>
    
    <ellipse cx="120" cy="76" rx="5" ry="7" fill="#2B1E1A"/>
    <circle cx="118" cy="74" r="2.5" fill="#FFFFFF"/>

    <!-- Beak -->
    <path d="M 86 86 C 86 80 114 80 114 86 C 114 96 86 96 86 86 Z" fill="#FF8C38"/>

    <!-- Big Heart being held -->
    <g transform="translate(100, 132) scale(0.95)">
      <path d="M 0 -15 C -20 -35 -40 -10 0 20 C 40 -10 20 -35 0 -15 Z" fill="url(#heartGrad)"/>
      <!-- Heart Shine -->
      <path d="M -12 -20 C -18 -20 -22 -15 -18 -8 C -16 -12 -12 -16 -8 -16 Z" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- Floating Mini Hearts -->
    <path d="M 45 45 C 40 38 32 46 45 56 C 58 46 50 38 45 45 Z" fill="#FF758F" transform="rotate(-15 45 45)"/>
    <path d="M 155 40 C 150 33 142 41 155 51 C 168 41 160 33 155 40 Z" fill="#FF4D6D" transform="rotate(15 155 40)"/>
  </g>
</svg>
