<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="duckGradSad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="70%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#E0A020"/>
    </radialGradient>
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70C6FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="50" ry="10" fill="#E8B4B8" opacity="0.3"/>

  <!-- Body drooping -->
  <path d="M 60 135 C 50 155 70 172 100 172 C 130 172 150 155 140 135 C 142 115 132 95 125 90 C 120 75 80 75 75 90 C 68 95 58 115 60 135 Z" fill="url(#duckGradSad)"/>
  
  <!-- Drooping Head -->
  <circle cx="100" cy="85" r="40" fill="url(#duckGradSad)"/>

  <!-- Sad Eyes (curved down) -->
  <path d="M 72 82 Q 80 76 88 82" stroke="#2B1E1A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 112 82 Q 120 76 128 82" stroke="#2B1E1A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Tear -->
  <path d="M 126 88 C 122 96 120 102 125 106 C 130 106 132 98 126 88 Z" fill="url(#tearGrad)"/>

  <!-- Sad Beak -->
  <path d="M 88 94 C 92 88 108 88 112 94 C 112 100 88 100 88 94 Z" fill="#FF8C38"/>

  <!-- Broken Heart in hands -->
  <g transform="translate(100, 142) scale(0.7)">
    <!-- Left half -->
    <path d="M -2 -15 C -22 -35 -42 -10 -5 18 L 0 5 L -8 -3 L 2 -8 L -2 -15 Z" fill="#993D4C"/>
    <!-- Right half -->
    <path d="M 2 -15 C 22 -35 42 -10 5 18 L 0 5 L 8 -3 L -2 -8 L 2 -15 Z" fill="#C9184A" transform="translate(5,0)"/>
  </g>
  
  <!-- Raincloud -->
  <g transform="translate(100, 25)">
    <path d="M -30 10 C -38 10 -42 0 -32 -5 C -30 -18 -10 -20 0 -12 C 10 -20 30 -15 28 -3 C 38 -2 35 10 25 10 Z" fill="#B0C4DE" opacity="0.8"/>
    <line x1="-15" y1="14" x2="-18" y2="22" stroke="#70C6FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="-3" y2="24" stroke="#70C6FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="14" x2="12" y2="22" stroke="#70C6FF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
