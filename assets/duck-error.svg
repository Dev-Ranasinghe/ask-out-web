<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="duckGradErr" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5BA"/>
      <stop offset="70%" stop-color="#FFD666"/>
      <stop offset="100%" stop-color="#E0A020"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="50" ry="10" fill="#E8B4B8" opacity="0.3"/>

  <!-- Body -->
  <path d="M 60 135 C 50 155 70 172 100 172 C 130 172 150 155 140 135 Z" fill="url(#duckGradErr)"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="40" fill="url(#duckGradErr)"/>

  <!-- Dizzy/Confused Spiral/Cross Eyes -->
  <!-- Left Eye: Spiral or Cross -->
  <g transform="translate(78, 76)">
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#2B1E1A" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#2B1E1A" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- Right Eye: Cross -->
  <g transform="translate(122, 76)">
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#2B1E1A" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#2B1E1A" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- O-shaped shocked beak -->
  <circle cx="100" cy="96" r="10" fill="#FF8C38"/>
  <circle cx="100" cy="96" r="6" fill="#2B1E1A"/>

  <!-- Glitch Question Marks & Error Symbol -->
  <g fill="#E63946" font-family="'Fredoka', sans-serif" font-weight="bold">
    <text x="45" y="55" font-size="28" transform="rotate(-20 45 55)">?</text>
    <text x="145" y="55" font-size="28" transform="rotate(20 145 55)">!</text>
    <text x="100" y="30" font-size="22" text-anchor="middle">404</text>
  </g>
</svg>
